<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/development/m3south/safesiteworks-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEAM - M3 South</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- SAFESITEWORKS-LOADER-START -->
    <style>
        #safesiteworks-loader {
            position: fixed;
            inset: 0;
            z-index: 2147483647;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            transition:
                opacity .30s ease,
                visibility .30s ease;
        }

        #safesiteworks-loader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #safesiteworks-loader img {
            width: min(280px, 68vw);
            height: auto;

            animation:
                sswBootPulse 1.25s ease-in-out infinite;
        }

        @keyframes sswBootPulse {

            0%,
            100% {
                opacity: .65;
                transform: scale(.97);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

    <div id="safesiteworks-loader" aria-label="Loading SafeSiteWorks">
        <img src="/development/m3south/safesiteworks-logo.png" alt="SafeSiteWorks">
    </div>

    <script>
        (function () {

            function removeLoader() {

                var loader =
                    document.getElementById(
                        "safesiteworks-loader"
                    );

                if (!loader) return;

                loader.classList.add("is-hidden");

                setTimeout(function () {

                    if (
                        loader &&
                        loader.parentNode
                    ) {
                        loader.parentNode
                            .removeChild(loader);
                    }

                }, 350);
            }

            window.addEventListener(
                "load",
                removeLoader
            );

            setTimeout(
                removeLoader,
                6000
            );

        })();
    </script>
    <!-- SAFESITEWORKS-LOADER-END -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
